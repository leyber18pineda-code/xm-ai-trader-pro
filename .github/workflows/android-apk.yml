
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'XM_AI_TRADER_PRO_android_source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        run: |
          mkdir android-project
          unzip -q XM_AI_TRADER_PRO_android_source.zip -d android-project
          echo "PROJECT_DIR=$(dirname "$(find "$PWD/android-project" -name settings.gradle.kts -print -quit)")" >> "$GITHUB_ENV"

     
      - name: Corregir Java y Kotlin
        run: |
          echo "Buscando archivos Gradle..."
          find "$PROJECT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print

          find "$PROJECT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +

          echo "Verificando configuración:"
          grep -R "VERSION_1_8\|VERSION_17" "$PROJECT_DIR" --include='build.gradle' --include='build.gradle.kts' || true
 
      
      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          cat > "$RUNNER_TEMP/jvm17.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
          }
          EOF
          gradle -I "$RUNNER_TEMP/jvm17.gradle" assembleDebug


      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: XM-AI-TRADER-PRO-APK
          path: '**/build/outputs/apk/debug/*.apk'
