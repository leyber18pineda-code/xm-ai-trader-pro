
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'XM_AI_TRADER_PRO_android_source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        run: |
          mkdir android-project
          unzip -q XM_AI_TRADER_PRO_android_source.zip -d android-project
          echo "PROJECT_DIR=$(dirname "$(find "$PWD/android-project" -name settings.gradle.kts -print -quit)")" >> "$GITHUB_ENV"

     
      
      - name: Corregir Java y Kotlin
        run: |
          FILE=$(find "$PROJECT_DIR" -path '*/app/build.gradle.kts' -print -quit)

          if [ -z "$FILE" ]; then
            echo "No se encontró app/build.gradle.kts"
            exit 1
          fi

          cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          echo "Configuración Java 17 agregada"

 
      
      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          cat > "$RUNNER_TEMP/jvm17.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
          }
          EOF
          gradle -I "$RUNNER_TEMP/jvm17.gradle" assembleDebug


      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: XM-AI-TRADER-PRO-APK
          path: '**/build/outputs/apk/debug/*.apk'
