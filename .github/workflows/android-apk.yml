name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-source/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar proyecto Android
        run: |
          test -f android-source/settings.gradle.kts
          test -f android-source/app/build.gradle.kts
          echo "Proyecto Android encontrado"

      - name: Corregir compatibilidad Java 17
        run: |
          FILE="android-source/app/build.gradle.kts"
          if ! grep -q "compileOptions" "$FILE"; then
            cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
          fi

      - name: Compilar APK
        run: |
          cd android-source
          cat > "$RUNNER_TEMP/jvm17.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
          }
          EOF
          gradle -I "$RUNNER_TEMP/jvm17.gradle" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: XM-AI-TRADER-PRO-APK
          path: 'android-source/**/build/outputs/apk/debug/*.apk'
