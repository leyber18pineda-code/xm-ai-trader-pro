
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'XM_AI_TRADER_PRO_android_source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        run: |
          mkdir android-project
          unzip -q XM_AI_TRADER_PRO_android_source.zip -d android-project
          echo "PROJECT_DIR=$(dirname "$(find "$PWD/android-project" -name settings.gradle.kts -print -quit)")" >> "$GITHUB_ENV"

            - name: Corregir Java y Kotlin
        run: |
          FILE=$(find "$PROJECT_DIR" -name build.gradle.kts -path '*/app/*' | head -n 1)
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$FILE"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: XM-AI-TRADER-PRO-APK
          path: '**/build/outputs/apk/debug/*.apk'
